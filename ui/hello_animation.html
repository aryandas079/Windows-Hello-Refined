<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Windows Hello Animation</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100vw;
      height: 100vh;
      background: transparent !important;
      background-color: transparent !important;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #main-ctr {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      opacity: 0;
    }

    svg {
      width: 200px;
      height: 164px;
      overflow: visible;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.35));
    }

    /* 
      SVG viewBox: 0 0 294 241
      Face center: (148, 120)

      SCANNING STATE elements:
        - #scan-arc  : top scanning arc (the upward arch)
        - #scan-eye  : single large circle centered at face center

      SMILE STATE elements (after spin):
        - #smile-arc : bottom smile curve
        - #eye-left  : small left eye circle
        - #eye-right : small right eye circle

      The #spin-group contains BOTH arcs stacked;
      it starts rotated 180° so top arc shows, then spins 900°
      to end at 0° where the bottom arc is correct.
    */

    /* Spin group pivots around the face center */
    #spin-group {
      transform-box: fill-box;
      transform-origin: 148px 120px;
    }

    #eye-left {
      transform-box: fill-box;
      transform-origin: center;
    }

    #eye-right {
      transform-box: fill-box;
      transform-origin: center;
    }

    #scan-eye {
      transform-box: fill-box;
      transform-origin: center;
    }

    .hello-text {
      color: #FFFFFF;
      letter-spacing: 2px;
      font-size: 22px;
      font-weight: 300;
      font-family: "Segoe UI", "Roboto", -apple-system, BlinkMacSystemFont, sans-serif;
      margin-top: 14px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
      opacity: 0;
    }
  </style>
</head>
<body>

<div id="main-ctr">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 294 241">
    <g fill="none">

      <!--
        SPIN GROUP — contains the bottom smile arc.
        Initial rotation = 180° → arc appears at TOP (scanning arc, Image 2).
        After 900° spin → 180+900 = 1080° → mod 360 = 0° → arc at BOTTOM (smile, Image 1).
      -->
      <g id="spin-group">
        <!-- Bottom smile arc (the actual smile curve) -->
        <path id="smile-arc"
          stroke="#FFFFFF"
          stroke-width="30"
          stroke-linecap="round"
          fill="none"
          d="M57 167 Q148 230 239 167"
        />
      </g>

      <!--
        SCANNING EYE — large single circle visible during scanning phase only.
        Centered at the face center (148, 130). Hidden after spin begins.
        Matches Image 2: big round "iris" below the top scanning arc.
      -->
      <circle id="scan-eye"
        cx="148" cy="134"
        r="38"
        fill="#FFFFFF"
        opacity="0"
      />

      <!--
        SMILE EYES — two small circles, hidden until after the spin.
        Matches Image 1 and Image 3.
        Left eye ~(106, 112), Right eye ~(190, 112), radius ~20.
      -->
      <circle id="eye-left"
        cx="106" cy="112"
        r="20"
        fill="#FFFFFF"
        opacity="0"
      />
      <circle id="eye-right"
        cx="190" cy="112"
        r="20"
        fill="#FFFFFF"
        opacity="0"
      />

    </g>
  </svg>
  <p class="hello-text" id="hello-text">Hello, Aryan</p>
</div>

<script>
  /* ── Username injection from Python ── */
  function setUsername(name) {
    document.getElementById("hello-text").textContent = "Hello, " + name;
  }

  /* ── Reference elements ── */
  var mainCtr   = document.getElementById("main-ctr");
  var spinGroup = document.getElementById("spin-group");
  var scanEye   = document.getElementById("scan-eye");
  var eyeLeft   = document.getElementById("eye-left");
  var eyeRight  = document.getElementById("eye-right");
  var helloText = document.getElementById("hello-text");

  /* ── Build timeline ── */
  function buildTimeline() {
    var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, delay: 0.1 });

    /* ── RESET / INITIAL STATE ── */
    tl.set(mainCtr,   { opacity: 0 })
      .set(helloText, { opacity: 0 })
      .set(spinGroup, { rotation: 180, transformOrigin: "148px 120px" })   // arc points UP
      .set(scanEye,   { opacity: 0, scale: 0.4 })
      .set(eyeLeft,   { opacity: 0, scale: 0.3 })
      .set(eyeRight,  { opacity: 0, scale: 0.3 })

    /* ── PHASE 1: Fade in ── */
      .to(mainCtr, { duration: 0.3, opacity: 1, ease: "power2.out" })

    /* ── PHASE 2: Scanning — show top arc + big eye ── */
      .to(scanEye, {
        duration: 0.3,
        opacity: 1,
        scale: 1,
        ease: "back.out(1.5)"
      })

    /* ── PHASE 3: Hold scanning for a moment ── */
      .to({}, { duration: 0.35 })   // pause — scanning

    /* ── PHASE 4: Spin 900° (arc sweeps from top → settles at bottom as smile) ──
        Simultaneously the scan eye fades out as the spin begins. ── */
      .to(scanEye, {
        duration: 0.3,
        opacity: 0,
        scale: 0.3,
        ease: "power2.in"
      })
      .to(spinGroup, {
        duration: 1.0,
        rotation: 1080,                        // 180 + 900 = 1080 → mod 360 = 0° (smile at bottom)
        transformOrigin: "148px 120px",
        ease: "circ.inOut"
      }, "<")                                  // "<" = same time as scanEye fade

    /* ── PHASE 5: Smiley — two eyes pop in ── */
      .to(eyeLeft, {
        duration: 0.3,
        opacity: 1,
        scale: 1,
        ease: "back.out(2)"
      }, "-=0.15")
      .to(eyeRight, {
        duration: 0.3,
        opacity: 1,
        scale: 1,
        ease: "back.out(2)"
      }, "-=0.26")

    /* ── PHASE 6: THE WINK (right eye) ── */
      .to(eyeRight, {
        duration: 0.12,
        scaleY: 0.08,
        ease: "power3.in"
      }, "+=0.25")
      .to(eyeRight, {
        duration: 0.18,
        scaleY: 1,
        ease: "back.out(2.5)"
      })

    /* ── PHASE 7: "Hello, Name" appears ── */
      .to(helloText, {
        duration: 0.35,
        opacity: 1,
        ease: "power2.out"
      }, "-=0.15")

    /* ── PHASE 8: Hold, then fade out ── */
      .to(mainCtr, {
        delay: 1.6,
        duration: 0.55,
        opacity: 0,
        ease: "power2.in"
      });

    return tl;
  }

  buildTimeline();
</script>

</body>
</html>
