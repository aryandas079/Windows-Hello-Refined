<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Windows Hello Transparent Animation</title>
  <!-- jQuery & GSAP with MorphSVGPlugin -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/1.20.3/TweenMax.min.js"></script>
  <!-- MorphSVGPlugin CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/1.20.3/plugins/MorphSVGPlugin.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600&display=swap');

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      /* 100% Fully Transparent Background */
      background: transparent !important;
      background-color: transparent !important;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', 'Roboto', sans-serif;
    }

    #main-ctr {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      height: 100%;
      background: transparent !important;
    }

    .hello {
      color: #FFFFFF;
      letter-spacing: 1.5px;
      font-size: 24px;
      font-family: 'Segoe UI', 'Roboto', sans-serif;
      font-weight: 300;
      margin-top: 15px;
      margin-bottom: 0;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      opacity: 0;
    }

    svg {
      width: 150px;
      height: 125px;
      transform: scale(0.65);
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.3));
    }

    #smile-up,
    #eye-to-left,
    #eye-to-right,
    #wink,
    #bg {
      visibility: hidden;
    }
  </style>
</head>
<body>

<div id="main-ctr">
  <svg xmlns="http://www.w3.org/2000/svg" width="294" height="241" viewBox="0 0 294 241">
    <g id="group" fill="none" fill-rule="evenodd">
      <g id="smile">
        <path id="smile-up" stroke="#FFF" stroke-width="30" d="M238.797 75.04C222.935 40.772 188.243 17 148 17c-39.62 0-73.857 23.04-90.046 56.453" stroke-linecap="round"/>
        <path id="smile-down" stroke="#FFF" stroke-width="30" d="M238.843 166c-15.863 34.268-50.554 58.04-90.797 58.04-39.62 0-73.857-23.04-90.046-56.453" stroke-linecap="round"/>
        <path id="bg" fill="#FFF" d="M43 2h211v237H43z" opacity="0"/>
      </g>
      <path id="eye-left" fill="#FFF" d="M148 173c29.27 0 53-23.73 53-53s-23.73-53-53-53c-4.956 0-9.753.68-14.303 1.952C111.374 75.194 95 95.685 95 120c0 29.27 23.73 53 53 53z"/>
      <path id="eye-right" fill="#FFF" d="M148 173c29.27 0 53-23.73 53-53s-23.73-53-53-53c-4.016 0-7.927.447-11.687 1.293C112.665 73.615 95 94.745 95 120c0 29.27 23.73 53 53 53z"/>
      <path id="eye-to-left" fill="#FFF" d="M106 143c12.15 0 22-9.85 22-22s-9.85-22-22-22c-2.028 0-3.992.274-5.857.788C90.836 102.352 84 110.878 84 121c0 12.15 9.85 22 22 22z"/>
      <path id="eye-to-right" fill="#FFF" d="M187 143c12.15 0 22-9.85 22-22s-9.85-22-22-22c-3.286 0-6.404.72-9.204 2.012C170.242 104.496 165 112.136 165 121c0 12.15 9.85 22 22 22z"/>
    </g>
  </svg>
  <h1 class="hello" id="hello-text">Hello, Aryan</h1>
</div>

<script>
  function setUsername(name) {
    document.getElementById("hello-text").innerText = "Hello, " + name;
  }

  $(document).ready(function() {
    var mainCtr = $("#main-ctr"),
        hello = $(".hello"),
        eyeLeft = $("#eye-left"),
        eyeRight = $("#eye-right"),
        eyeToLeft = $("#eye-to-left"),
        eyeToRight = $("#eye-to-right"),
        smileUp = $("#smile-up"),
        smileDown = $("#smile-down"),
        smile = $("#smile");

    var tl = new TimelineMax({
      repeat: -1,
      repeatDelay: 0.4,
      delay: 0.2
    });

    TweenMax.set([mainCtr, hello], {
      opacity: 0
    });

    tl
      .to(mainCtr, 0.3, {
        opacity: 1
      })
      .to(smileDown, 0.3, {
        morphSVG: "#smile-up"
      })
      .to(smile, 0.3, {
        rotation: -30,
        transformOrigin: "center center",
        ease: Circ.ease
      })
      .to(smile, 0.9, {
        rotation: 900,
        transformOrigin: "center center",
        ease: Circ.easeInOut
      })
      .to(eyeLeft, 0.3, {
        morphSVG: "#eye-to-left",
        ease: Power2.ease
      }, "-=0.3")
      .to(eyeRight, 0.3, {
        morphSVG: "#eye-to-right",
        ease: Power2.ease
      }, "-=0.3")
      .to(eyeRight, 0.1, {
        scaleY: 0.25,
        transformOrigin: "center center"
      })
      .to(eyeRight, 0.1, {
        scaleY: 1
      })
      .to(hello, 0.3, {
        opacity: 1
      }, "-=0.3")
      .to(mainCtr, 0.6, {
        delay: 1.2,
        opacity: 0
      });
  });
</script>

</body>
</html>
