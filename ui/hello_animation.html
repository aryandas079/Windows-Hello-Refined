<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Windows Hello Transparent Animation</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600&display=swap');

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: transparent !important;
      background-color: transparent !important;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    #main-ctr {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      height: 100%;
      background: transparent !important;
    }

    .hello {
      color: #FFFFFF;
      letter-spacing: 1.5px;
      font-size: 26px;
      font-family: 'Segoe UI', Roboto, sans-serif;
      font-weight: 300;
      margin-top: 18px;
      margin-bottom: 0;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.45);
      opacity: 0;
      transform: translateY(5px);
    }

    svg {
      width: 160px;
      height: 130px;
      overflow: visible;
      filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.35));
    }

    /* SVG elements */
    #smile-arc {
      stroke: #FFFFFF;
      stroke-width: 24;
      stroke-linecap: round;
      fill: none;
      transform-origin: 148px 120px;
    }

    .eye {
      fill: #FFFFFF;
      transform-origin: center center;
    }

    #eye-left {
      transform-origin: 106px 115px;
    }

    #eye-right {
      transform-origin: 190px 115px;
    }
  </style>
</head>
<body>

<div id="main-ctr">
  <svg xmlns="http://www.w3.org/2000/svg" width="296" height="240" viewBox="0 0 296 240">
    <!-- Spinning radar arc that settles into the smile -->
    <path id="smile-arc" d="M 68 145 C 80 205 216 205 228 145" />

    <!-- Left and right eye pupils -->
    <circle id="eye-left" class="eye" cx="106" cy="115" r="18" opacity="0" />
    <circle id="eye-right" class="eye" cx="190" cy="115" r="18" opacity="0" />
  </svg>
  <h1 class="hello" id="hello-text">Hello, Aryan</h1>
</div>

<script>
  function setUsername(name) {
    document.getElementById("hello-text").innerText = "Hello, " + name;
  }

  $(document).ready(function() {
    var mainCtr = $("#main-ctr"),
        hello = $(".hello"),
        arc = $("#smile-arc"),
        eyeL = $("#eye-left"),
        eyeR = $("#eye-right");

    // Master Timeline for authentic Windows Hello face animation
    var tl = gsap.timeline({
      repeat: -1,
      repeatDelay: 0.6,
      delay: 0.2
    });

    // 1. Initial State: Fade in container
    tl.set(mainCtr, { opacity: 0 })
      .set(hello, { opacity: 0, y: 8 })
      .set(arc, {
        rotation: 0,
        scale: 1,
        attr: { d: "M 68 95 C 80 35 216 35 228 95" } // Top scanning arc
      })
      .set([eyeL, eyeR], { opacity: 0, scale: 0.2 })
      .to(mainCtr, { duration: 0.3, opacity: 1 });

    // 2. SCANNING PHASE: Arc rotates 900 degrees smoothly
    tl.to(arc, {
      duration: 0.35,
      rotation: -35,
      ease: "power2.in"
    })
    .to(arc, {
      duration: 0.95,
      rotation: 900,
      ease: "power3.inOut"
    });

    // 3. SMILING FACE EMERGENCE: Arc transitions to bottom smile and eyes pop in
    tl.to(arc, {
      duration: 0.35,
      attr: { d: "M 68 145 C 80 205 216 205 228 145" }, // Bottom smile arc
      rotation: 0,
      ease: "back.out(1.4)"
    }, "-=0.25")
    .to([eyeL, eyeR], {
      duration: 0.3,
      opacity: 1,
      scale: 1,
      ease: "back.out(1.7)",
      stagger: 0.08
    }, "-=0.2");

    // 4. THE ICONIC WINK: Right eye closes and opens, smile broadens!
    tl.to(eyeR, {
      duration: 0.12,
      scaleY: 0.12,
      ease: "power2.in"
    }, "+=0.15")
    .to(eyeR, {
      duration: 0.16,
      scaleY: 1,
      ease: "back.out(2)"
    })
    // 5. GREETING TEXT FADE-IN
    .to(hello, {
      duration: 0.35,
      opacity: 1,
      y: 0,
      ease: "power2.out"
    }, "-=0.25");

    // 6. Hold on screen, then fade out smoothly
    tl.to(mainCtr, {
      delay: 1.6,
      duration: 0.5,
      opacity: 0,
      ease: "power2.in"
    });
  });
</script>

</body>
</html>
