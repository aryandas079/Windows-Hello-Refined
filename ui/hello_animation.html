<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Windows Hello Official Transparent Animation</title>
  <!-- jQuery & GSAP (No paid plugins needed) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background: transparent !important;
      background-color: transparent !important;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Roboto", sans-serif;
    }

    #main-ctr {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: transparent !important;
      opacity: 0;
    }

    svg {
      width: 180px;
      height: 147px;
      overflow: visible;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.4));
    }

    /* Transform origin for smile container */
    #smile-group {
      transform-origin: 148px 120.5px;
    }

    /* Eye origins for winking */
    #eye-right {
      transform-origin: 187px 121px;
    }

    #eye-left {
      transform-origin: 106px 121px;
    }

    .hello {
      color: #FFFFFF;
      letter-spacing: 1.5px;
      font-size: 24px;
      font-weight: 300;
      margin-top: 16px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      opacity: 0;
    }
  </style>
</head>
<body>

<div id="main-ctr">
  <svg xmlns="http://www.w3.org/2000/svg" width="294" height="241" viewBox="0 0 294 241">
    <g id="group" fill="none" fill-rule="evenodd">
      <!-- The Official Windows Hello Arc (Rotating from top to bottom) -->
      <g id="smile-group">
        <path id="smile" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round"
              d="M238.843 166c-15.863 34.268-50.554 58.04-90.797 58.04-39.62 0-73.857-23.04-90.046-56.453" />
      </g>

      <!-- The Official Windows Hello Eyes -->
      <path id="eye-left" fill="#FFFFFF" opacity="0"
            d="M106 143c12.15 0 22-9.85 22-22s-9.85-22-22-22c-2.028 0-3.992.274-5.857.788C90.836 102.352 84 110.878 84 121c0 12.15 9.85 22 22 22z"/>

      <path id="eye-right" fill="#FFFFFF" opacity="0"
            d="M187 143c12.15 0 22-9.85 22-22s-9.85-22-22-22c-3.286 0-6.404.72-9.204 2.012C170.242 104.496 165 112.136 165 121c0 12.15 9.85 22 22 22z"/>
    </g>
  </svg>
  <h1 class="hello" id="hello-text">Hello, Aryan</h1>
</div>

<script>
  function setUsername(name) {
    document.getElementById("hello-text").innerText = "Hello, " + name;
  }

  $(document).ready(function() {
    var mainCtr = $("#main-ctr"),
        hello = $(".hello"),
        smileGroup = $("#smile-group"),
        eyeLeft = $("#eye-left"),
        eyeRight = $("#eye-right");

    // Master Timeline
    var tl = gsap.timeline({
      repeat: -1,
      repeatDelay: 0.6,
      delay: 0.2
    });

    // Initial setup:
    // smileGroup at rotation: 180deg (renders smile-up at top, exactly like Image 1)
    // Eyes hidden
    tl.set(mainCtr, { opacity: 0 })
      .set(hello, { opacity: 0 })
      .set(smileGroup, { rotation: 180 }) // 180 deg = top arc (smile-up)
      .set([eyeLeft, eyeRight], { opacity: 0, scale: 0.3 })
      .to(mainCtr, { duration: 0.3, opacity: 1 });

    // Step 1: Arc rotates slightly backwards then spins 900 degrees smoothly
    tl.to(smileGroup, {
      duration: 0.3,
      rotation: 150, // Slight anticipatory wind-up (-30)
      ease: "power2.in"
    })
    .to(smileGroup, {
      duration: 0.95,
      rotation: 900, // 900 deg = 0 deg mod 360 = bottom smile!
      ease: "circ.inOut"
    })
    // Step 2: As the spin finishes, the eyes fade in and pop into place
    .to([eyeLeft, eyeRight], {
      duration: 0.35,
      opacity: 1,
      scale: 1,
      ease: "back.out(1.8)",
      stagger: 0.06
    }, "-=0.25")
    // Step 3: THE WINK! Right eye closes down and opens back up
    .to(eyeRight, {
      duration: 0.12,
      scaleY: 0.15,
      transformOrigin: "187px 121px",
      ease: "power2.in"
    }, "+=0.15")
    .to(eyeRight, {
      duration: 0.16,
      scaleY: 1.0,
      transformOrigin: "187px 121px",
      ease: "back.out(2)"
    })
    // Step 4: Greeting text appears
    .to(hello, {
      duration: 0.35,
      opacity: 1,
      ease: "power2.out"
    }, "-=0.2")
    // Step 5: Hold, then fade out
    .to(mainCtr, {
      delay: 1.6,
      duration: 0.6,
      opacity: 0,
      ease: "power2.in"
    });
  });
</script>

</body>
</html>
